    <script>
        // Initialize Theme from localStorage (Default: light)
        (function() {
            var theme = localStorage.getItem('bussync_theme') || 'light';
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.documentElement.classList.remove('light');
            } else {
                document.documentElement.classList.add('light');
                document.documentElement.classList.remove('dark');
            }
        })();

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'bg-primary': '#F7F7F5',
                        'bg-card': '#FFFFFF',
                        'karnataka-red': '#D71920',
                        'karnataka-yellow': '#FFCC00',
                        'karnataka-yellow-light': '#FEF9C3',
                        'karnataka-red-light': '#FEE2E2',
                        'accent-teal': '#D71920',

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        @keyframes floatDelayed {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(8px); }
        }

        .animate-float {
            animation: float 5s ease-in-out infinite;
        }

        .animate-float-delayed {
            animation: floatDelayed 6s ease-in-out infinite;
        }

        .sync-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #2DD4BF;
            animation: syncPulse 2s cubic-bezier(0, 0, 0.2, 1) infinite;
        }
        
        @keyframes syncPulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
        }

        .sync-pulse-once::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #2DD4BF;
            animation: syncPulse 2s cubic-bezier(0, 0, 0.2, 1) forwards;
        }

        @keyframes livePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.9); }
        }

        @keyframes busDrive {
            0% { transform: translateX(-150%) translateY(0); }
            10% { transform: translateX(-120%) translateY(-2px); }
            20% { transform: translateX(-90%) translateY(0); }
            30% { transform: translateX(-60%) translateY(-2px); }
            40% { transform: translateX(-30%) translateY(0); }
            50% { transform: translateX(0%) translateY(-2px); }
            60% { transform: translateX(30%) translateY(0); }
            70% { transform: translateX(60%) translateY(-2px); }
            80% { transform: translateX(90%) translateY(0); }
            90% { transform: translateX(120%) translateY(-2px); }
            100% { transform: translateX(150%) translateY(0); }
        }

        .animate-bus-drive {
            animation: busDrive 2.5s linear infinite;
        }

        .animate-live-pulse {
            animation: livePulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @media (prefers-reduced-motion: reduce) {
            .animate-live-pulse { animation: none; }
            .pulse-glow::after { animation: none; }
        }

<body class="font-sans antialiased min-h-screen selection:bg-accent-teal/30 selection:text-white">
    <div id="root"></div>
    <script>
        function showBusSyncError(msg, loc, stack) {
            let el = document.getElementById('debug-error');
            if (!el) {
                el = document.createElement('div');
                el.id = 'debug-error';
                el.style = 'position:fixed;bottom:20px;left:20px;right:20px;background:#7f1d1d;color:#fff;padding:20px;border-radius:12px;font-family:monospace;font-size:13px;z-index:999999;box-shadow:0 10px 40px rgba(0,0,0,0.8);white-space:pre-wrap;max-height:85vh;overflow:auto;line-height:1.5;border:2px solid #ef4444;';
                document.body.appendChild(el);
            }
            el.textContent = "BusSync Error Details:\n" + msg + (loc ? "\nLocation: " + loc : "") + "\n\nStack:\n" + (stack || "No stack available");
        }
        window.addEventListener('error', function(e) {
            console.error('WINDOW ERROR:', e);
            showBusSyncError(e.message, (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || ''), e.error ? e.error.stack : '');
        });
        window.addEventListener('unhandledrejection', function(e) {
            console.error('UNHANDLED REJECTION:', e.reason);
            showBusSyncError(e.reason ? e.reason.message || String(e.reason) : 'Unhandled Rejection', '', e.reason ? e.reason.stack : '');
        });
    </script>
    <script src="/js/app.bundle.js?v=nextgen-3.0"></script>
